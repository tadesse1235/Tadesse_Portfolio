<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <defs>
        <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c4dff" />
            <stop offset="50%" stop-color="#3fe7d4" />
            <stop offset="100%" stop-color="#ff7ad9" />
        </linearGradient>
        <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3fe7d4" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#7c4dff" stop-opacity="0.2" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Outer Tech Hexagon / Squircle Frame -->
    <rect x="8" y="8" width="104" height="104" rx="26" ry="26" 
          fill="#0c0f17" stroke="url(#cyberGradient)" stroke-width="3" filter="url(#glow)"/>

    <!-- Circuit Traces / Nodes -->
    <circle cx="24" cy="24" r="3.5" fill="#3fe7d4" />
    <line x1="24" y1="24" x2="38" y2="24" stroke="#3fe7d4" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="96" cy="96" r="3.5" fill="#ff7ad9" />
    <line x1="82" y1="96" x2="96" y2="96" stroke="#ff7ad9" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="96" cy="24" r="3" fill="#7c4dff" />
    <circle cx="24" cy="96" r="3" fill="#3fe7d4" />

    <!-- Stylized Monogram "T" with Tech Angle Cuts -->
    <!-- Top Horizontal Bar of T -->
    <path d="M 32 36 L 88 36 C 90.5 36 92 38.5 90.5 41 L 85 49 C 84 50.5 82 51.5 80 51.5 L 67 51.5 L 67 86 C 67 88.5 64.5 90.5 62 90.5 L 56 90.5 C 53.5 90.5 51 88.5 51 86 L 51 51.5 L 38 51.5 C 36 51.5 34 50.5 33 49 L 27.5 41 C 26 38.5 27.5 36 32 36 Z" 
          fill="url(#cyberGradient)" />

    <!-- Central Micro-Core Point -->
    <polygon points="59,40 63,44 59,48 55,44" fill="#ffffff" />
    <circle cx="59" cy="74" r="2.5" fill="#3fe7d4" />
</svg>
